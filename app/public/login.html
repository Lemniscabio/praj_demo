<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <title>Sign in · Bioprocess Studio</title>
    <style>
      :root {
        --bg: #0b0d0f;
        --panel: #14171a;
        --border: #22272c;
        --text: #e8ebee;
        --muted: #8a9199;
        --accent: #c6ff4d;
        --error: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 32px 28px;
        box-shadow: 0 24px 64px -24px rgba(0, 0, 0, 0.6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 24px;
      }
      .brand img { width: 22px; height: 22px; }
      .brand span {
        font-family: 'Fraunces', serif;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 500;
        font-size: 22px;
        letter-spacing: -0.01em;
        margin: 0 0 6px;
      }
      p.sub {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 24px;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
        letter-spacing: 0.02em;
        text-transform: uppercase;
      }
      input[type='password'] {
        width: 100%;
        background: #0b0d0f;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 11px 13px;
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 120ms ease;
      }
      input[type='password']:focus { border-color: #3a424a; }
      button {
        width: 100%;
        margin-top: 16px;
        background: var(--accent);
        color: #0b0d0f;
        border: none;
        border-radius: 8px;
        padding: 11px 13px;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: filter 120ms ease, transform 120ms ease;
      }
      button:hover:not(:disabled) { filter: brightness(1.05); }
      button:active:not(:disabled) { transform: translateY(1px); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .error {
        color: var(--error);
        font-size: 12.5px;
        margin-top: 12px;
        min-height: 16px;
      }
      footer {
        margin-top: 20px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="/lemnisca-logo.svg" alt="" />
        <span>Lemnisca LABS</span>
      </div>
      <h1>Sign in</h1>
      <p class="sub">This demo is password-protected. Enter the access password to continue.</p>
      <form id="f" autocomplete="off">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" autofocus required />
        <button id="b" type="submit">Continue</button>
        <div class="error" id="err" role="alert" aria-live="polite"></div>
      </form>
      <footer>Bioprocess Studio · access-gated preview</footer>
    </main>
    <script>
      (function () {
        var form = document.getElementById('f');
        var pw = document.getElementById('pw');
        var btn = document.getElementById('b');
        var err = document.getElementById('err');

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          err.textContent = '';
          btn.disabled = true;
          btn.textContent = 'Checking…';
          try {
            var res = await fetch('/api/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ password: pw.value }),
            });
            if (res.ok) {
              window.location.href = '/';
              return;
            }
            if (res.status === 401) {
              err.textContent = 'Incorrect password.';
            } else if (res.status === 500) {
              err.textContent = 'Server not configured. Set APP_PASSWORD and AUTH_SECRET.';
            } else {
              err.textContent = 'Something went wrong. Try again.';
            }
          } catch (_) {
            err.textContent = 'Network error. Try again.';
          } finally {
            btn.disabled = false;
            btn.textContent = 'Continue';
            pw.select();
          }
        });
      })();
    </script>
  </body>
</html>
